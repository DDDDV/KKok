name: VocalSeparatorPrototype

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0

targets:
  VocalSeparator:
    type: application
    platform: iOS
    sources:
      - path: VocalSeparator
        excludes:
          - Resources
      - path: VocalSeparator/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - Models/README.md
          # These task-local SenseVoice assets use a different CTC pipeline and
          # are intentionally not bundled by the WhisperKit implementation.
          - Models/SenseVoicePreprocessor.mlmodelc
          - Models/SenseVoiceSmall.mlmodelc
          - Models/SenseVoiceTokenizer.model
          - Models/WhisperKitResources.bundle
      # The signed app contains only the trusted model manifest. The 602 MiB
      # model/tokenizer tree is installed on demand after explicit user consent.
      - path: VocalSeparator/Resources/Models/WhisperKitResources.bundle/MODEL_MANIFEST.json
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocalSeparatorPrototype
        PRODUCT_NAME: VocalSeparator
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: VocalSeparator/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 947X8JA62C
        # Release builds for China mainland should set one or more HTTPS roots
        # (comma/semicolon separated) backed by an ICP-compliant local CDN.
        # Each root must expose the exact relative paths in MODEL_MANIFEST.json.
        TRANSCRIPTION_MODEL_MIRROR_BASE_URLS: ""
        SUPPORTS_MACCATALYST: false
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    scheme:
      testTargets:
        - VocalSeparatorTests

  VocalSeparatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocalSeparatorTests
    dependencies:
      - target: VocalSeparator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocalSeparatorPrototypeTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 947X8JA62C
