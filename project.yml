name: VocalSeparatorPrototype
fileGroups:
  - Config

options:
  developmentLanguage: en
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0

targets:
  VocalSeparator:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    preBuildScripts:
      - name: Verify bundled LAME corresponding source
        script: /usr/bin/python3 "$SRCROOT/Scripts/package-lame-source.py" --check
        basedOnDependencyAnalysis: false
    sources:
      - path: VocalSeparator
        excludes:
          - Resources
      - path: VocalSeparator/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - Models/README.md
          # These task-local SenseVoice assets use a different CTC pipeline and
          # are intentionally not bundled by the WhisperKit implementation.
          - Models/SenseVoicePreprocessor.mlmodelc
          - Models/SenseVoiceSmall.mlmodelc
          - Models/SenseVoiceTokenizer.model
          - Models/WhisperKitResources.bundle
      # The signed app contains only the trusted model manifest. The 602 MiB
      # model/tokenizer tree is installed on demand after explicit user consent.
      - path: VocalSeparator/Resources/Models/WhisperKitResources.bundle/MODEL_MANIFEST.json
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.easykaraoke.singfreely
        PRODUCT_NAME: VocalSeparator
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: VocalSeparator/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 947X8JA62C
        # Release builds for China mainland should set one or more HTTPS roots
        # (comma/semicolon separated) backed by an ICP-compliant local CDN.
        # Each root must expose the exact relative paths in MODEL_MANIFEST.json.
        TRANSCRIPTION_MODEL_MIRROR_BASE_URLS: ""
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: LAME
        embed: true
      - package: ArgmaxOSS
        product: WhisperKit
    scheme:
      testTargets:
        - VocalSeparatorTests

  # Keep the LGPL encoder replaceable as a separate dynamic library.
  LAME:
    type: framework
    platform: iOS
    sources:
      - path: ThirdParty/LAME/lame-4.0/libmp3lame
        excludes:
          - i386
          - vector
          - mpglib_interface.c
          - "*.rc"
          - "*.ico"
          - "*.in"
          - "Makefile*"
        headerVisibility: project
      - path: ThirdParty/LAME/lame-4.0/include/lame.h
        headerVisibility: public
      - path: ThirdParty/LAME/Integration/config.h
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocalSeparator.LAME
        PRODUCT_NAME: LAME
        MACH_O_TYPE: mh_dylib
        DEFINES_MODULE: true
        MODULEMAP_FILE: "$(SRCROOT)/ThirdParty/LAME/Integration/module.modulemap"
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
        DEVELOPMENT_TEAM: 947X8JA62C
        DYLIB_CURRENT_VERSION: "4.0"
        DYLIB_COMPATIBILITY_VERSION: "4.0"
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "HAVE_CONFIG_H=1"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/LAME/Integration"
          - "$(SRCROOT)/ThirdParty/LAME/lame-4.0/include"
          - "$(SRCROOT)/ThirdParty/LAME/lame-4.0"
        CLANG_WARN_DOCUMENTATION_COMMENTS: false

  VocalSeparatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocalSeparatorTests
      - path: Config/ExportLifetime.storekit
        buildPhase: resources
    dependencies:
      - target: VocalSeparator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocalSeparatorPrototypeTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 947X8JA62C

schemes:
  VocalSeparator-StoreKit:
    build:
      targets:
        VocalSeparator: all
    run:
      config: Debug
      storeKitConfiguration: Config/ExportLifetime.storekit
    test:
      targets:
        - VocalSeparatorTests
