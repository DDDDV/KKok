name: VocalSeparatorPrototype

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0

targets:
  VocalSeparator:
    type: application
    platform: iOS
    sources:
      - path: VocalSeparator
        excludes:
          - Resources
      - path: VocalSeparator/Resources
        buildPhase: resources
        excludes:
          - Models/README.md
          # These task-local SenseVoice assets use a different CTC pipeline and
          # are intentionally not bundled by the WhisperKit implementation.
          - Models/SenseVoicePreprocessor.mlmodelc
          - Models/SenseVoiceSmall.mlmodelc
          - Models/SenseVoiceTokenizer.model
          - Models/WhisperKitResources.bundle
      # Keep the model/tokenizer hierarchy intact. Expanding this directory
      # would flatten duplicate config.json files in Copy Bundle Resources.
      - path: VocalSeparator/Resources/Models/WhisperKitResources.bundle
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocalSeparatorPrototype
        PRODUCT_NAME: VocalSeparator
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: 人声分离原型
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 947X8JA62C
        SUPPORTS_MACCATALYST: false
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    scheme:
      testTargets:
        - VocalSeparatorTests

  VocalSeparatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocalSeparatorTests
    dependencies:
      - target: VocalSeparator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocalSeparatorPrototypeTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 947X8JA62C
